name: pitlane
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.8
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set .env first}
      GENERIC_TIMEZONE: Asia/Dubai
      TZ: Asia/Dubai
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/files/workflows:ro
      - ./.credentials:/files/credentials:ro
    restart: unless-stopped
volumes:
  n8n_data:
